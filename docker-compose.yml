# ============================================================
# Déploiement Maison Cavalier — https://app.maison-cavalier.com/
#
# L'application se connecte à un projet Supabase Cloud (Postgres + RLS,
# Auth, Realtime, Storage) — voir .env.production.example pour les
# variables requises. Le serveur héberge plusieurs apps derrière un
# Traefik partagé (Dokploy) : pas de reverse proxy dédié ici, le
# routage HTTPS (Let's Encrypt) se fait via les labels traefik.* et
# le réseau externe `dokploy-network`.
#
# Usage :
#   cp .env.production.example .env
#   # renseigner .env avec les valeurs du projet Supabase
#   docker compose up -d --build
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.maison-cavalier-web.rule: Host(`app.maison-cavalier.com`)
      traefik.http.routers.maison-cavalier-web.entrypoints: websecure
      traefik.http.routers.maison-cavalier-web.service: maison-cavalier-web
      traefik.http.routers.maison-cavalier-web.tls.certresolver: letsencrypt
      traefik.http.services.maison-cavalier-web.loadbalancer.server.port: "3000"

networks:
  dokploy-network:
    external: true
